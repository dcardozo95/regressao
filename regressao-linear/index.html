<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Regressão Linear</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #243447;
        }

        .container {
            max-width: 850px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #5f6b76;
            margin-bottom: 35px;
        }

        .arquivo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            background: white;
            padding: 18px 20px;
            margin-bottom: 14px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .arquivo h2 {
            margin: 0;
            font-size: 18px;
            word-break: break-word;
        }

        .tipo {
            margin-top: 6px;
            color: #5f6b76;
            font-size: 14px;
        }

        .botao {
            background: #1f6feb;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .botao:hover {
            background: #1857b6;
        }

        .mensagem {
            text-align: center;
            padding: 25px;
            color: #5f6b76;
        }

        .erro {
            background: #fff1f1;
            color: #a12626;
            border-radius: 10px;
        }

        .voltar {
            display: inline-block;
            margin-top: 25px;
            color: #1f6feb;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .arquivo {
                flex-direction: column;
                align-items: flex-start;
            }

            .botao {
                width: 100%;
                box-sizing: border-box;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Regressão Linear</h1>

        <p class="subtitulo">
            Selecione uma base de dados para baixar.
        </p>

        <section id="lista-arquivos">
            <p class="mensagem">Carregando arquivos...</p>
        </section>

        <a class="voltar" href="../">← Voltar para a página inicial</a>
    </main>

    <script>
        const usuario = "dcardozo95";
        const repositorio = "regressao";
        const pasta = "regressao-linear";

        const apiUrl =
            `https://api.github.com/repos/${usuario}/${repositorio}/contents/${pasta}`;

        const lista = document.getElementById("lista-arquivos");

function formatarNome(nome) {

    nome = nome.replace(/\.csv$/i, "");
    nome = nome.replace(/[-_]/g, " ");

    return nome.split(" ").map(palavra => {
        if (palavra.length === 0) return "";
        return palavra.charAt(0).toUpperCase() + palavra.slice(1);
    }).join(" ");

}
        async function carregarArquivos() {
            try {
                const resposta = await fetch(apiUrl);

                if (!resposta.ok) {
                    throw new Error("Não foi possível consultar o repositório.");
                }

                const arquivos = await resposta.json();

                const arquivosCsv = arquivos
                    .filter(arquivo =>
                        arquivo.type === "file" &&
                        arquivo.name.toLowerCase().endsWith(".csv")
                    )
                    .sort((a, b) =>
                        a.name.localeCompare(b.name, "pt-BR")
                    );

                lista.innerHTML = "";

                if (arquivosCsv.length === 0) {
                    lista.innerHTML =
                        '<p class="mensagem">Nenhum arquivo CSV disponível no momento.</p>';
                    return;
                }

                arquivosCsv.forEach(arquivo => {
                    const item = document.createElement("article");
                    item.className = "arquivo";

                    const informacoes = document.createElement("div");

                    const titulo = document.createElement("h2");
                    titulo.textContent = formatarNome(arquivo.name);

                    const tipo = document.createElement("p");
                    tipo.className = "tipo";
                    tipo.textContent = arquivo.name;

                    informacoes.appendChild(titulo);
                    informacoes.appendChild(tipo);

                    const botao = document.createElement("a");
                    botao.className = "botao";
                    botao.href = arquivo.download_url;
                    botao.textContent = "Baixar CSV";
                    botao.setAttribute("download", arquivo.name);

                    item.appendChild(informacoes);
                    item.appendChild(botao);

                    lista.appendChild(item);
                });

            } catch (erro) {
                lista.innerHTML = `
                    <p class="mensagem erro">
                        Não foi possível carregar os arquivos. Tente novamente mais tarde.
                    </p>
                `;

                console.error(erro);
            }
        }

        carregarArquivos();
    </script>
</body>
</html>
