<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Regressão Logística</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fa;
            color: #243447;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 45px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #172033;
        }

        .subtitulo {
            text-align: center;
            color: #64748b;
            margin-bottom: 40px;
        }

        .arquivo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .arquivo h2 {
            margin: 0;
            font-size: 20px;
        }

        .tipo {
            margin-top: 8px;
            color: #64748b;
        }

        .botao {
            background: #16a34a;
            color: white;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
            white-space: nowrap;
        }

        .botao:hover {
            background: #15803d;
        }

        .mensagem {
            text-align: center;
            color: #64748b;
            padding: 25px;
        }

        .erro {
            color: #b91c1c;
        }

        .voltar {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            .arquivo {
                flex-direction: column;
                align-items: flex-start;
            }

            .botao {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📊 Regressão Logística</h1>

        <p class="subtitulo">
            Selecione uma base de dados para baixar.
        </p>

        <div id="lista-arquivos">
            <p class="mensagem">Carregando arquivos...</p>
        </div>

        <a class="voltar" href="../">
            ← Voltar para a página inicial
        </a>

    </div>

    <script>
        const usuario = "dcardozo95";
        const repositorio = "regressao";
        const pasta = "regressao-logistica";

        const apiUrl =
            `https://api.github.com/repos/${usuario}/${repositorio}/contents/${pasta}`;

        const lista = document.getElementById("lista-arquivos");

        function formatarNome(nome) {
            nome = nome
                .replace(/\.csv$/i, "")
                .replace(/[-_]/g, " ");

            return nome
                .split(" ")
                .map(palavra => {
                    if (palavra.length === 0) {
                        return "";
                    }

                    return palavra.charAt(0).toUpperCase() + palavra.slice(1);
                })
                .join(" ");
        }

        async function carregarArquivos() {
            try {
                const resposta = await fetch(apiUrl);

                if (!resposta.ok) {
                    throw new Error(
                        "Não foi possível consultar o repositório."
                    );
                }

                const arquivos = await resposta.json();

                const arquivosCsv = arquivos
                    .filter(arquivo =>
                        arquivo.type === "file" &&
                        arquivo.name.toLowerCase().endsWith(".csv")
                    )
                    .sort((a, b) =>
                        a.name.localeCompare(b.name, "pt-BR")
                    );

                lista.innerHTML = "";

                if (arquivosCsv.length === 0) {
                    lista.innerHTML =
                        '<p class="mensagem">Nenhum arquivo CSV disponível no momento.</p>';

                    return;
                }

                arquivosCsv.forEach(arquivo => {
                    const item = document.createElement("article");
                    item.className = "arquivo";

                    const informacoes = document.createElement("div");

                    const titulo = document.createElement("h2");
                    titulo.textContent = formatarNome(arquivo.name);

                    const tipo = document.createElement("p");
                    tipo.className = "tipo";
                    tipo.textContent = arquivo.name;

                    informacoes.appendChild(titulo);
                    informacoes.appendChild(tipo);

                    const botao = document.createElement("a");
                    botao.className = "botao";

                    botao.href =
                        `https://${usuario}.github.io/${repositorio}/${pasta}/${encodeURIComponent(arquivo.name)}`;

                    botao.textContent = "Baixar CSV";
                    botao.setAttribute("download", arquivo.name);

                    item.appendChild(informacoes);
                    item.appendChild(botao);

                    lista.appendChild(item);
                });

            } catch (erro) {
                lista.innerHTML = `
                    <p class="mensagem erro">
                        Não foi possível carregar os arquivos. Tente novamente mais tarde.
                    </p>
                `;

                console.error(erro);
            }
        }

        carregarArquivos();
    </script>

</body>
</html>
